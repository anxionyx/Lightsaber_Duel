name: Build and Release Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release

    steps:
      - name: Checkout code
        uses: [actions/checkout@v4](https://github.com)

      - name: Setup Node.js
        uses: [actions/setup-node@v4](https://github.com)
        with:
          node-version: '24' # Specify your required Node version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # 'npm ci' is faster and more reliable for CI environments

      - name: Build project
        run: npm run build

      - name: Zip build output
        # Replace 'dist' with your actual build output directory (e.g., 'build' or 'out')
        run: zip -r Lightsaber_Duel-v1.zip dist

      - name: Create GitHub Release
        uses: [softprops/action-gh-release@v2](https://github.com/softprops/action-gh-release)
        with:
          files: Lightsaber_Duel-v1.zip
          generate_release_notes: true
        
